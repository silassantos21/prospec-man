services:
  - type: web
    name: prospecman-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DEFAULT_OUTPUT_DIR
        value: /tmp/projects
      - key: DEFAULT_LANGUAGE
        value: pt
      - key: USD_TO_BRL_RATE
        value: "5.70"
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
